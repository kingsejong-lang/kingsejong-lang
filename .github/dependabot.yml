# Weekly dependency updates. Each ecosystem opens at most one grouped PR per week;
# security updates are still raised immediately as separate PRs.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /web
      - /site
      - /vscode-extension
    schedule:
      interval: weekly
    ignore:
      # Type packages must match the oldest runtime the extension supports
      # (engines.vscode ^1.91.0, which runs on Node 20). Newer types let code use
      # APIs that do not exist there, and vsce rejects @types/vscode > engines.vscode.
      # Raise these by hand together with engines.vscode.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 accepts typescript >=4.8.4 <6.1.0; a newer compiler
      # fails npm ci with ERESOLVE. Lift this once typescript-eslint widens its range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
