name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup C++ (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    - name: Setup C++ (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload build artifacts (Ubuntu)
      if: runner.os == 'Linux' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: kingsejong-linux
        path: build/bin/kingsejong

    - name: Upload build artifacts (macOS)
      if: runner.os == 'macOS' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: kingsejong-macos
        path: build/bin/kingsejong

    - name: Upload build artifacts (Windows)
      if: runner.os == 'Windows' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: kingsejong-windows
        path: build/bin/Release/kingsejong.exe

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup C++
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 clang-tidy-16
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-16 100

    - name: Run clang-tidy
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        find src -name '*.cpp' -o -name '*.h' | xargs clang-tidy -p build || true

  memory-check:
    name: Memory Safety (Valgrind)
    runs-on: ubuntu-latest
    # 정상 실행은 15분 안에 끝난다. 러너가 멈추면 기본 6시간 대신 여기서 끊는다.
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 valgrind

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build

    # 테스트 실행 파일 전체를 Valgrind 아래에서 한 번 돈다 (약 30초). 잘못된 메모리 접근,
    # 초기화되지 않은 값 사용, definite/indirect 누수가 하나라도 있으면 잡이 실패한다.
    # 예제·파일 테스트가 저장소 루트를 기준으로 하므로 루트에서 실행한다.
    - name: Run tests with Valgrind
      run: |
        valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect \
          --error-exitcode=1 --log-file=build/valgrind.log \
          ./build/bin/kingsejong_tests --gtest_brief=1

    - name: Upload Valgrind log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: valgrind-log
        path: build/valgrind.log

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 lcov

    - name: Configure CMake with coverage
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Generate coverage report
      run: |
        lcov --directory build --capture --output-file coverage.info --ignore-errors mismatch,inconsistent,gcov,unused,source
        # 프로젝트 코드만 센다: FetchContent 로 받은 의존성(build/_deps)과 include/third_party 의 단일 헤더 라이브러리는 뺀다
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/googletest/*' '*/_deps/*' '*/third_party/*' --output-file coverage.info --ignore-errors mismatch,inconsistent,gcov,unused,source
        lcov --list coverage.info
        lcov --summary coverage.info

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.info

  api-docs:
    name: API Reference (Doxygen)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    - name: Generate API reference
      run: |
        version=$(sed -n 's/^project(KingSejong VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        mkdir -p build/api  # Doxygen 1.9 은 중첩된 출력 디렉터리를 만들지 못한다
        # 주석 경고가 다시 쌓이지 않도록 경고를 실패로 본다 (배포 워크플로는 경고가 있어도 배포한다)
        (cat Doxyfile; echo "PROJECT_NUMBER=$version"; echo "WARN_AS_ERROR=FAIL_ON_WARNINGS") | doxygen -
        test -f build/api/html/index.html

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    # 확장 테스트가 build/bin/kingsejong 으로 실제 포맷을 돌린다
    - name: Build kingsejong
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target kingsejong -j

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        check-latest: true  # 러너 캐시의 이전 패치 대신 최신 24.x(보안 패치 포함)를 받는다

    - name: Lint, test and package
      working-directory: vscode-extension
      run: |
        npm ci --no-audit --no-fund
        npm run lint
        npm test
        npm run package

    - name: Upload extension package
      uses: actions/upload-artifact@v7
      with:
        name: kingsejong-vscode
        path: vscode-extension/*.vsix

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13

    - name: Configure CMake with sanitizers
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build

    - name: Run tests with sanitizers
      run: |
        export ASAN_OPTIONS=detect_leaks=1:symbolize=1
        export UBSAN_OPTIONS=print_stacktrace=1
        ctest --test-dir build --output-on-failure

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 python3

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run benchmarks
      run: |
        cd benchmarks
        python3 run_benchmarks.py --interpreter ../build/bin/kingsejong --runs 5 --output benchmark_results.txt

    - name: Display results
      if: always()
      run: |
        echo "=== Benchmark Results ==="
        cat benchmarks/benchmark_results.txt || echo "No results file found"

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: benchmarks/benchmark_results.txt

  regression-test:
    name: Performance Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write  # 회귀가 나면 PR 에 결과 댓글을 단다

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 python3

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run regression tests
      id: regression
      run: |
        cd benchmarks
        python3 regression_test.py

    - name: Upload regression results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: regression-results
        path: benchmarks/regression_results.json

    - name: Comment on PR (if regression detected)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('benchmarks/regression_results.json', 'utf8'));

          let comment = '## ⚠️ Performance Regression Detected\n\n';
          comment += '| Benchmark | Status | Time | Threshold |\n';
          comment += '|-----------|--------|------|----------|\n';

          for (const [name, data] of Object.entries(results)) {
            if (!data.passed) {
              const status = data.error ? '❌ Error' : '🔴 Regression';
              const time = data.avg ? `${data.avg.toFixed(3)}s` : 'N/A';
              const threshold = data.threshold ? `${data.threshold}s` : 'N/A';
              comment += `| ${name} | ${status} | ${time} | ${threshold} |\n`;
            }
          }

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
