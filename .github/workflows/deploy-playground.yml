name: Deploy Playground and Docs to GitHub Pages

on:
  # main 브랜치에 푸시될 때 실행
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'docs/**'
      - 'site/**'
      - 'src/**'
      - 'include/**'
      - 'wasm/**'
      - 'CMakeLists.txt'
      - '.github/workflows/deploy-playground.yml'

  # 수동 실행 허용
  workflow_dispatch:

# GitHub Pages에 배포하기 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 방지
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. WebAssembly 빌드
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WASM
        run: |
          source emsdk/emsdk_env.sh
          mkdir build-wasm
          cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DEMSCRIPTEN=ON
          emmake make kingsejong_wasm -j$(nproc)

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-files
          path: |
            build-wasm/wasm/kingsejong.js
            build-wasm/wasm/kingsejong.wasm
          retention-days: 1

  # 2. 웹 플레이그라운드 빌드 및 배포
  build-and-deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true  # 러너 캐시의 이전 패치 대신 .nvmrc 메이저의 최신 패치(보안 패치 포함)를 받는다

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-files
          path: web/public

      - name: Install dependencies
        working-directory: ./web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Install docs site dependencies
        working-directory: ./site
        run: npm ci --no-audit --no-fund

      - name: Build docs site
        working-directory: ./site
        run: npm run build

      - name: Add docs site to the Pages artifact
        run: cp -r site/.vitepress/dist web/dist/docs

      - name: Build C++ API reference (Doxygen)
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          version=$(sed -n 's/^project(KingSejong VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p build/api  # Doxygen 1.9 은 중첩된 출력 디렉터리를 만들지 못한다
          (cat Doxyfile; echo "PROJECT_NUMBER=$version") | doxygen -
          cp -r build/api/html web/dist/api

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 3. 배포 상태 확인
  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check deployment
        run: |
          echo "Playground deployed: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Docs deployed: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/"
          echo "API reference deployed: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/"
