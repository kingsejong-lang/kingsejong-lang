<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="한글 기반 프로그래밍 언어 KingSejong의 온라인 플레이그라운드">
    <meta name="keywords" content="KingSejong, 한글, 프로그래밍 언어, 플레이그라운드, WebAssembly">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KingSejong">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="KingSejong 플레이그라운드">
    <meta property="og:description" content="한글 기반 프로그래밍 언어 KingSejong 을 브라우저에서 바로 실행해 본다">
    <meta property="og:url" content="https://kingsejong-lang.github.io/kingsejong-lang/">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%233451b2%22%2F%3E%3Cpath%20d%3D%22M32%2013%20L13%2052%20M32%2013%20L51%2052%22%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
    <title>KingSejong 플레이그라운드</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <h1 class="title">
                <span class="title-emoji">🇰🇷</span>
                <span class="title-text">KingSejong</span>
                <span class="title-subtitle">온라인 플레이그라운드</span>
            </h1>
            <div class="header-actions">
                <button id="runBtn" class="btn btn-primary" title="코드 실행 (Ctrl+Enter)">
                    ▶️ 실행
                </button>
                <button id="clearBtn" class="btn btn-secondary" title="출력 지우기">
                    🗑️ 지우기
                </button>
                <button id="resetBtn" class="btn btn-secondary" title="환경 초기화">
                    🔄 초기화
                </button>
                <button id="examplesBtn" class="btn btn-secondary" title="예제 보기">
                    📚 예제
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="main-container">
        <!-- 왼쪽: 코드 에디터 -->
        <div class="editor-panel">
            <div class="panel-header">
                <h2 class="panel-title">코드 에디터</h2>
                <div class="status" id="status">
                    <span class="status-icon">⏳</span>
                    <span class="status-text">로딩 중...</span>
                </div>
            </div>
            <div id="editor" class="editor-container"></div>
        </div>

        <!-- 오른쪽: 출력 영역 -->
        <div class="output-panel">
            <div class="panel-header">
                <h2 class="panel-title">실행 결과</h2>
            </div>
            <div id="output" class="output-container">
                <div class="output-placeholder">
                    코드를 실행하면 결과가 여기에 표시됩니다.
                    <br><br>
                    <strong>단축키:</strong>
                    <br>• Ctrl + Enter: 실행
                    <br>• Ctrl + /: 주석 토글
                </div>
            </div>
        </div>
    </main>

    <!-- 예제 모달 -->
    <div id="examplesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📚 예제 프로그램</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="examplesList">
                <!-- 예제 목록이 여기에 동적으로 추가됩니다 -->
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
        <p>
            KingSejong v0.3.2 (WebAssembly) |
            <a href="./docs/">문서</a> |
            <a href="https://github.com/kingsejong-lang/kingsejong-lang" target="_blank">GitHub</a> |
            Made with ❤️ by KingSejong Team
        </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
